name: Compilar Sistema Operacional

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout do codigo
      uses: actions/checkout@v4

    # Instala as ferramentas necessárias (exatamente as que seu Makefile usa)
    - name: Instalar dependencias do sistema
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          build-essential \
          nasm \
          qemu-system-x86 \
          grub-pc-bin \
          grub-common \
          xorriso \
          mtools

 
